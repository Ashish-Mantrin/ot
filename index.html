    <style>
        /* =========================================================
   BASIC RESET
========================================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            background: #eeeeee;
            font-family: Arial, Helvetica, sans-serif;
            color: #000;
            padding: 15px;
        }

        .page-wrapper {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }


        /* =========================================================
   FORM CONTAINER
========================================================= */

        .form-container {
            width: 100%;
            background: #ffffff;
            border: 1px solid #222;
        }


        /* =========================================================
   HEADER
========================================================= */

        .header {
            text-align: center;
        }

        .company-name {
            font-size: 27px;
            font-weight: bold;
            padding: 15px 10px 12px;
            border-bottom: 1px solid #222;
        }

        .form-title {
            font-size: 24px;
            font-weight: bold;
            padding: 12px 10px;
            border-bottom: 1px solid #222;
        }


        /* =========================================================
   DATE
========================================================= */

        .date-section {
            padding: 16px 10px 14px;
            font-size: 15px;
            font-weight: bold;
        }

        .date-input {
            width: 180px;
            margin-left: 5px;
            border: none;
            border-bottom: 1px solid #555;
            outline: none;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 15px;

            color: #0645ad;
            background: transparent;

            padding: 4px;
        }

        .date-input:focus {
            border-bottom: 2px solid #0645ad;
        }


        /* =========================================================
   TABLE WRAPPER
========================================================= */

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding: 0 10px;
        }


        /* =========================================================
   TABLE
========================================================= */

        table {
            width: 100%;
            min-width: 1120px;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th,
        td {
            border: 1px solid #555;
            padding: 6px;
            height: 46px;
            font-size: 14px;
        }

        th {
            text-align: center;
            font-weight: bold;
            background: #ffffff;
            height: 48px;
        }

        td {
            background: #ffffff;
        }


        /* =========================================================
   COLUMN WIDTHS
========================================================= */

        .col-sno {
            width: 55px;
        }

        .col-code {
            width: 85px;
        }

        .col-name {
            width: 250px;
        }

        .col-position {
            width: 230px;
        }

        .col-time {
            width: 125px;
        }

        .col-hours {
            width: 135px;
        }

        .col-sign {
            width: 115px;
        }

        .col-remarks {
            width: 145px;
        }


        /* =========================================================
   SERIAL NUMBER
========================================================= */

        .sno {
            text-align: center;
            font-size: 14px;
        }


        /* =========================================================
   EMPLOYEE INFORMATION INPUTS
========================================================= */

        .cell-input {
            width: 100%;
            height: 32px;

            border: none;
            outline: none;

            background: transparent;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;

            color: #000;

            padding: 3px;
        }

        .cell-input:focus {
            background: #f4f8ff;
            outline: 1px solid #8db8ea;
        }


        /* =========================================================
   TIME INPUT
========================================================= */

        .time-write-cell {
            padding: 0 !important;
            background: #ffffff;
        }

        .time-write-input {
            width: 100%;
            height: 44px;

            border: none;
            outline: none;

            background: transparent;

            text-align: center;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 15px;

            /* BLUE PEN COLOR */
            color: #0645ad;

            padding: 5px;
        }

        .time-write-input:focus {
            background: #f5f9ff;
            outline: 2px solid #b8d4f5;
        }

        .time-write-input::placeholder {
            color: transparent;
        }


        /* =========================================================
   TOTAL HOURS
   BLANK / MANUAL ENTRY
========================================================= */

        .hours-write-cell {
            padding: 0 !important;
        }

        .hours-write-input {
            width: 100%;
            height: 44px;

            border: none;
            outline: none;

            background: transparent;

            text-align: center;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 15px;

            color: #0645ad;

            padding: 5px;
        }

        .hours-write-input:focus {
            background: #f5f9ff;
            outline: 2px solid #b8d4f5;
        }


        /* =========================================================
   SIGN / REMARKS
========================================================= */

        .handwrite-input {
            width: 100%;
            height: 43px;

            border: none;
            outline: none;

            background: transparent;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;

            color: #0645ad;

            text-align: center;
        }

        .handwrite-input:focus {
            background: #f5f9ff;
            outline: 2px solid #b8d4f5;
        }


        /* =========================================================
   BOTTOM SECTION
========================================================= */

        .bottom-section {
            padding: 20px 10px 25px;
        }

        .bottom-row {
            margin-bottom: 18px;
            font-size: 15px;
            font-weight: bold;
        }

        .bottom-label {
            display: inline-block;
            min-width: 185px;
        }

        .bottom-line-input {
            display: inline-block;

            width: calc(100% - 195px);

            height: 30px;

            border: none;
            border-bottom: 1px solid #555;

            outline: none;

            background: transparent;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;

            color: #0645ad;
        }

        .bottom-line-input:focus {
            border-bottom: 2px solid #0645ad;
        }

        .justification-input {
            display: inline-block;

            width: calc(100% - 195px);

            min-height: 65px;

            border: 1px solid #999;

            outline: none;

            resize: vertical;

            padding: 7px;

            vertical-align: top;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;

            color: #0645ad;

            background: #ffffff;
        }

        .justification-input:focus {
            border: 2px solid #8db8ea;
        }


        /* =========================================================
   BUTTONS
========================================================= */

        .actions {
            text-align: center;
            padding: 20px 10px 30px;
        }

        button {
            border: none;
            border-radius: 6px;

            padding: 13px 25px;
            margin: 5px;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }

        .download-btn {
            background: #1976d2;
            color: #ffffff;
        }

        .print-btn {
            background: #333333;
            color: #ffffff;
        }

        .clear-btn {
            background: #d32f2f;
            color: #ffffff;
        }

        button:hover {
            opacity: 0.9;
        }


        /* =========================================================
   MOBILE
========================================================= */

        @media (max-width: 700px) {

            body {
                padding: 6px;
            }

                font-size: 19px;
                padding: 13px 5px 10px;
            }

            .form-title {
                font-size: 18px;
                padding: 10px 5px;
            }

            .date-section {

            }

            .date-input {

            }

            .table-wrapper {

           Allows finger swipe left/right
           on the table.
        */
                overflow-x: auto;
            }

            table {
                min-width: 1120px;
            }

                padding: 5px;
            }

            .cell-input {
                font-size: 13px;
            }

            .time-write-input,
            .hours-write-input {
                font-size: 15px;
            }

            .bottom-section {
                padding: 15px 8px 20px;
            }

            .bottom-label {
                display: block;
                margin-bottom: 8px;
            }

            .bottom-line-input {
                display: block;
                width: 100%;
            }

            .justification-input {
                display: block;
                width: 100%;
            }

            .actions {
                padding: 15px 5px 20px;
            }

            button {
                display: block;
                width: 100%;
                margin: 6px 0;
            }
        }

   PRINT VERSION
========================================================= */

                padding: 0;
                background: #ffffff;

                width: 100%;

            }

                padding: 0 5px;

                min-width: 0;
            }

            td {

                height: 38px;
                padding: 4px;

                font-size: 21px;
                padding: 10px;

                padding: 8px;
            }

            .date-section {

                font-size: 10px;
            }

            .time-write-input,
            .hours-write-input,
            .handwrite-input {
                font-size: 11px;
            }

            .time-write-input,
            .hours-write-input,
            .handwrite-input {
                height: 35px;
            }

            .bottom-section {
                padding: 12px 7px;
            }
        }
    </style>
</head>

            </button>

            <button class="clear-btn" onclick="clearForm()">
                🗑 Clear Form
            </button>

        </div>

    </div>


    <script>

        /* =========================================================
           FORMAT TIME
        
           Examples:
        
           1830  -> 18:30
           0930  -> 09:30
           6:30  -> 6:30
        ========================================================= */

        function formatTimeInput(input) {

            let value = input.value;

            /*
               Remove everything except numbers
               and colon.
            */

            value = value.replace(/[^0-9:]/g, "");

            /*
               If user types 1830,
               turn it into 18:30.
            */

            if (
                value.length === 4 &&
                !value.includes(":")
            ) {

                value =
                    value.substring(0, 2) +
                    ":" +
                    value.substring(2, 4);
            }

            /*
               Limit to HH:MM.
            */

            if (value.length > 5) {

                value =
                    value.substring(0, 5);
            }

            input.value = value;
        }


        /* =========================================================
           TIME INPUT EVENTS
        ========================================================= */

        document
            .querySelectorAll(".time-write-input")
            .forEach(input => {

                input.addEventListener(
                    "input",
                    function () {

                        /*
                           Keep typed time blue.
                        */

                        this.style.color =
                            "#0645ad";

                        /*
                           Automatically format 1830 -> 18:30
                           once four numbers are entered.
                        */

                        formatTimeInput(this);

                    }
                );

            });


        /* =========================================================
           DATE FORMATTING
        
           19092026 -> 19/09/2026
        ========================================================= */

        const dateInput =
            document.getElementById("formDate");

        dateInput.addEventListener(
            "input",
            function () {

                let value =
                    this.value.replace(
                        /[^0-9]/g,
                        ""
                    );

                if (value.length > 8) {
                    value =
                        value.substring(0, 8);
                }

                if (value.length >= 5) {

                    value =
                        value.substring(0, 2) +
                        "/" +
                        value.substring(2, 4) +
                        "/" +
                        value.substring(4);

                } else if (value.length >= 3) {

                    value =
                        value.substring(0, 2) +
                        "/" +
                        value.substring(2);

                }

                this.value = value;

            }
        );


        /* =========================================================
           DOWNLOAD AS PNG
        ========================================================= */

        async function downloadForm() {

            const form =
                document.getElementById(
                    "overtimeForm"
                );


            /*
               Clone the form.
            */

            const clone =
                form.cloneNode(true);


            /*
               Put clone outside the screen.
            */

            clone.style.position =
                "absolute";

            clone.style.left =
                "-100000px";

            clone.style.top =
                "0";

            clone.style.width =
                "1300px";

            clone.style.background =
                "#ffffff";


            document.body.appendChild(
                clone
            );


            /*
               Copy values from all inputs.
            */

            const originalInputs =
                form.querySelectorAll(
                    "input, textarea"
                );

            const clonedInputs =
                clone.querySelectorAll(
                    "input, textarea"
                );


            clonedInputs.forEach(
                (element, index) => {

                    const original =
                        originalInputs[index];


                    /*
                       Get current value.
                    */

                    const value =
                        original.value;


                    /*
                       Replace form control
                       with visible text.
                    */

                    const text =
                        document.createElement(
                            "div"
                        );


                    text.textContent =
                        value;


                    text.style.fontFamily =
                        "Arial, Helvetica, sans-serif";

                    text.style.fontSize =
                        getComputedStyle(
                            element
                        ).fontSize;

                    text.style.color =
                        getComputedStyle(
                            element
                        ).color;

                    text.style.width =
                        "100%";

                    text.style.minHeight =
                        getComputedStyle(
                            element
                        ).height;

                    text.style.lineHeight =
                        getComputedStyle(
                            element
                        ).lineHeight;

                    text.style.padding =
                        getComputedStyle(
                            element
                        ).padding;

                    text.style.textAlign =
                        getComputedStyle(
                            element
                        ).textAlign;


                    /*
                       Replace input.
                    */

                    element.parentNode.replaceChild(
                        text,
                        element
                    );

                }
            );


            try {

                /*
                   Generate high-resolution image.
                */

                const canvas =
                    await html2canvas(
                        clone,
                        {
                            scale: 2,
                            backgroundColor:
                                "#ffffff",

                            useCORS: true,

                            logging: false,

                            windowWidth: 1300
                        }
                    );


                /*
                   Create download link.
                */

                const link =
                    document.createElement(
                        "a"
                    );


                const date =
                    document
                        .getElementById(
                            "formDate"
                        )
                        .value
                        .replace(
                            /[^0-9]/g,
                            "-"
                        );


                link.download =
                    "Wonderbee_Employee_Overtime_" +
                    (date || "Form") +
                    ".png";


                link.href =
                    canvas.toDataURL(
                        "image/png"
                    );


                link.click();


            } catch (error) {

                console.error(error);

                alert(
                    "Unable to create the image. Please try again."
                );

            } finally {

                /*
                   Remove temporary copy.
                */

                document.body.removeChild(
                    clone
                );

            }

        }


        /* =========================================================
           PRINT
        ========================================================= */

        function printForm() {

            window.print();

        }


        /* =========================================================
           CLEAR FORM
        ========================================================= */

        function clearForm() {

            const confirmed =
                confirm(
                    "Are you sure you want to clear all entered information?"
                );


            if (!confirmed) {
                return;
            }


            /*
               Clear all editable inputs.
            */

            document
                .querySelectorAll(
                    "input, textarea"
                )
                .forEach(
                    element => {

                        element.value = "";

                    }
                );

        }

    </script>

</body>

</html>
